appId: com.agentnotch.app
productName: AgentNotch
directories:
  output: dist
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
files:
  - src/**/*
  - assets/**/*
  - "!**/*.map"

# 1024² source — macOS icns conversion requires ≥512 (assets/icons/icon.png is 256).
icon: assets/icons/agent-notch.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/agent-notch.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/agent-notch.png
  category: public.app-category.developer-tools
  # Unsigned OSS builds — no Developer ID in CI.
  identity: null

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icons/agent-notch.png
  category: Development
  maintainer: AgentNotch <102866310+NastyRunner13@users.noreply.github.com>

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
