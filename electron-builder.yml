appId: com.agentnotch.app
productName: AgentNotch
directories:
  output: dist
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
files:
  - src/**/*
  - assets/**/*
  - "!**/*.map"

# 1024² source — macOS icns conversion requires ≥512 (assets/icons/icon.png is 256).
icon: assets/icons/agent-notch.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/agent-notch.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # electron-updater installs from the zip. The dmg is the download on the release page.
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icons/agent-notch.png
  category: public.app-category.developer-tools
  # Identity is unset on purpose. scripts/release-build.js passes
  # -c.mac.identity=null when MAC_CSC_LINK / CSC_LINK is absent, so a local
  # keychain is not used. A Developer ID in that env var signs and, when
  # Apple notarization credentials are set, notarizes.

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icons/agent-notch.png
  category: Development
  maintainer: AgentNotch <102866310+NastyRunner13@users.noreply.github.com>

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Baked into app-update.yml. Drafts and prereleases are ignored.
# Local and CI builds pass --publish never; the release workflow uploads the yml.
publish:
  provider: github
  owner: NastyRunner13
  repo: AgentNotch
  releaseType: release
